services:
  # CRM Sheraos (Node/React) — servido em https://sheraos.com.br/crm pelo Traefik da Locaweb.
  crm:
    build:
      context: .
      dockerfile: Dockerfile
    image: sheraos-crm:latest
    container_name: sheraos-crm-app
    restart: unless-stopped
    depends_on:
      - evolution
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      ANTHROPIC_API_KEY_GLOBAL: ${ANTHROPIC_API_KEY_GLOBAL}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    volumes:
      - sheraos-crm-data:/app/server/data
    mem_limit: 400m
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.sheraos-crm.rule=Host(`sheraos.com.br`) && PathPrefix(`/crm`)
      - traefik.http.routers.sheraos-crm.entrypoints=websecure
      - traefik.http.routers.sheraos-crm.tls=true
      - traefik.http.routers.sheraos-crm.tls.certresolver=letsencrypt
      - traefik.http.routers.sheraos-crm.priority=100
      - traefik.http.services.sheraos-crm.loadbalancer.server.port=3002
    networks:
      - web
      - sheraos-internal

  # Evolution API (WhatsApp) — acessada SOMENTE pelo CRM via network interna, nao exposta pro Traefik.
  evolution:
    image: evoapicloud/evolution-api:homolog
    container_name: sheraos-evolution-api
    restart: unless-stopped
    depends_on:
      - evolution-postgres
    environment:
      TZ: America/Sao_Paulo
      SERVER_TYPE: http
      SERVER_PORT: 8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evo:${EVO_DB_PASSWORD}@evolution-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_sheraos
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      CONFIG_SESSION_PHONE_CLIENT: Sheraos CRM
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: 'false'
      LOG_LEVEL: ERROR
    volumes:
      - sheraos-evo-instances:/evolution/instances
    mem_limit: 300m
    networks:
      - sheraos-internal

  # Postgres da Evolution — isolado, so evolution container fala com ele.
  evolution-postgres:
    image: postgres:16-alpine
    container_name: sheraos-evolution-postgres
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: ${EVO_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - sheraos-evo-pg:/var/lib/postgresql/data
    mem_limit: 150m
    networks:
      - sheraos-internal

volumes:
  sheraos-crm-data:
    name: sheraos-crm-data
  sheraos-evo-instances:
    name: sheraos-evo-instances
  sheraos-evo-pg:
    name: sheraos-evo-pg

networks:
  # web = network do Traefik ja existente na VPS Locaweb (external). Rota publica.
  web:
    external: true
  # Rede privada isolada CRM <-> Evolution <-> Postgres. Nada exposto pra fora.
  sheraos-internal:
    driver: bridge
